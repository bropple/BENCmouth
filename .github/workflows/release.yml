name: release

# Tag-triggered. CI artifacts expire after 90 days and live on a run page
# nobody thinks to visit; a release is permanent and sits on the repo front
# page, which is where someone looking for a binary actually looks.
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write        # needed to create the release

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - name: raylib
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j2
          cmake --install /tmp/raylib/build
      - name: Build
        run: |
          make dict
          make clean-objs
          make audio OPT="-O2 -DBM_WITH_DICT=1"
          RAYLIB=/tmp/rl make gui-dict
          ./bm -l && ./bm "release build" -o /dev/null || true

      # The plugin, and it is played before it is packaged: `make clap-test`
      # loads the built bundle the way a DAW does. A plugin that only compiles
      # is not evidence of anything - see the CLAP jobs in ci.yml.
      - name: Plugin
        run: |
          make clap-fetch
          make clap
          make clap-test
          make vst3-fetch
          make vst3

      - name: Package
        run: |
          V="${GITHUB_REF_NAME:-dev}"
          P="bencmouth-clap-$V-linux-x86_64"
          mkdir -p "$P"
          cp build/BENCmouth.clap README.md LICENSE NOTICE "$P"/
          cp -r build/BENCmouth.vst3 "$P"/
          cp -r songs "$P"/
          tar czf "$P.tar.gz" "$P"
          D="bencmouth-$V-linux-x86_64"
          mkdir -p "$D"
          cp bm README.md LICENSE NOTICE "$D"/
          cp -r voices songs "$D"/
          tar czf "$D.tar.gz" "$D"
          G="bencmouth-gui-$V-linux-x86_64"
          mkdir -p "$G"
          cp bencmouth-gui bm README.md LICENSE NOTICE "$G"/
          cp -r voices songs "$G"/
          tar czf "$G.tar.gz" "$G"
          ls -l ./*.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: pkg-linux, path: '*.tar.gz', if-no-files-found: error }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # From source and static. Homebrew's raylib is a dylib under
      # /opt/homebrew, and a release binary linked against it aborts at launch
      # on any machine that does not happen to have it - which is every machine
      # that has just downloaded a release.
      - name: raylib
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build
      - name: Build
        run: |
          make dict
          make clean-objs
          make audio OPT="-O2 -DBM_WITH_DICT=1"
          RAYLIB=/tmp/rl make gui-dict
      # Universal and ad-hoc signed by the makefile, and played by clap-test
      # before it is packaged. Unsigned arm64 code does not load at all, and a
      # host refusing it says nothing about why - which is the failure this
      # step exists to make impossible to ship.
      - name: Plugin
        run: |
          make clap-fetch
          make clap
          lipo -info build/BENCmouth.clap/Contents/MacOS/BENCmouth | grep -q x86_64
          lipo -info build/BENCmouth.clap/Contents/MacOS/BENCmouth | grep -q arm64
          codesign --verify --deep --strict build/BENCmouth.clap
          make clap-test

      # The shims. Both find BENCmouth.clap at run time, so neither is any use
      # without it and all three ship in one image.
      - name: VST3 and AU
        run: |
          make vst3-fetch
          make vst3
          make au-fetch
          make au
          ls -d build/BENCmouth.vst3 build/BENCmouth.component

      # Ad-hoc, for the reason the CLAP is: unsigned arm64 code does not load,
      # and a host that refuses it says nothing about why.
      - name: Sign them
        run: |
          codesign --force --sign - --timestamp=none --deep build/BENCmouth.vst3
          codesign --force --sign - --timestamp=none --deep build/BENCmouth.component
          codesign --verify --deep --strict build/BENCmouth.vst3
          codesign --verify --deep --strict build/BENCmouth.component

      # Writes the disk image's .DS_Store directly. Driving Finder over
      # AppleScript, which is the usual way, needs an interactive session and
      # cannot work on a runner. Anchored to this job by a step only this job
      # has: every platform's `Build` step is worded identically, so a replace
      # aimed at one of them lands on whichever comes first in the file.
      - name: dmgbuild
        run: |
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install --quiet dmgbuild
          /tmp/dmgvenv/bin/dmgbuild --help >/dev/null

      - name: The GUI is self-contained
        run: |
          otool -L bencmouth-gui
          if otool -L bencmouth-gui | tail -n +2 | \
             grep -vE '^[[:space:]]+(/usr/lib/|/System/)'; then
            echo "links a library that will not be present on a stock macOS"
            exit 1
          fi
          echo "self-contained"
      - name: Package
        run: |
          V="${GITHUB_REF_NAME:-dev}"
          A="$(uname -m)"
          D="bencmouth-$V-macos-$A"
          mkdir -p "$D"
          cp bm README.md LICENSE NOTICE "$D"/
          cp -r voices songs "$D"/
          tar czf "$D.tar.gz" "$D"
          # The GUI ships as a disk image, not a tarball. A .app is a directory
          # that Finder draws as one icon, and a tarball of one arrives looking
          # like a folder called Contents to anyone who opens it - which is
          # exactly what happened to the first person who tried. A .dmg mounts
          # as a window with the app on one side and Applications on the other.
          BM_VERSION="${V#v}" ./tools/macos-app.sh bencmouth-gui BENCmouth.app
          # A release must not ship a bundle macOS will call damaged.
          codesign --verify --deep --strict --verbose=2 BENCmouth.app
          # No version in the volume name: it becomes the mounted disk's name,
          # and "BENCmouth" is what belongs on a desktop.
          DMGBUILD=/tmp/dmgvenv/bin/dmgbuild \
            ./tools/macos-dmg.sh BENCmouth.app \
              "bencmouth-gui-$V-macos-$A.dmg" BENCmouth
          # A release must not quietly ship the unstyled fallback.
          mkdir -p /tmp/dmg
          hdiutil attach "bencmouth-gui-$V-macos-$A.dmg" -nobrowse -mountpoint /tmp/dmg
          ls -la /tmp/dmg
          test -f /tmp/dmg/.DS_Store
          test -L /tmp/dmg/Applications
          test -d /tmp/dmg/BENCmouth.app
          hdiutil detach /tmp/dmg

          # And the plug-ins, in an image of their own. Separate from the
          # application's because these install somewhere else: dragging to
          # /Applications is a gesture everybody knows, and
          # ~/Library/Audio/Plug-Ins/<format> is a hidden directory three
          # levels down that nobody should have to be told about - so that part
          # is a script to double-click.
          #
          # It carries the .app as well. The plugin opens its window by
          # starting the application, so a plug-in installed without one plays
          # a song it cannot show you.
          DMGBUILD=/tmp/dmgvenv/bin/dmgbuild ./tools/macos-plugin-dmg.sh \
            "bencmouth-plugins-$V-macos-universal.dmg" "BENCmouth Plug-Ins"
          mkdir -p /tmp/pdmg
          hdiutil attach "bencmouth-plugins-$V-macos-universal.dmg" \
            -nobrowse -mountpoint /tmp/pdmg
          ls -la /tmp/pdmg
          test -x "/tmp/pdmg/Install Plug-Ins.command"
          test -d /tmp/pdmg/BENCmouth.clap
          test -d /tmp/pdmg/BENCmouth.vst3
          test -d /tmp/pdmg/BENCmouth.component
          test -d /tmp/pdmg/BENCmouth.app
          hdiutil detach /tmp/pdmg

          ls -l ./*.dmg
          ls -l ./*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: |
            *.tar.gz
            *.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            git
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-cmake
            make zip python
      # raylib's own Makefile, not cmake. cmake's "MinGW Makefiles" generator
      # wants mingw32-make, which is a separate package from the MSYS make that
      # is already here - and picking the wrong generator is the kind of thing
      # that fails at configure time for reasons unrelated to this project.
      # raylib ships a plain Makefile that needs neither.
      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          make -C /tmp/raylib/src PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC -j2
          mkdir -p /tmp/rl/include /tmp/rl/lib
          cp /tmp/raylib/src/raylib.h /tmp/raylib/src/raymath.h /tmp/raylib/src/rlgl.h /tmp/rl/include/
          cp /tmp/raylib/src/libraylib.a /tmp/rl/lib/
          ls -l /tmp/rl/lib /tmp/rl/include
      - name: Build the CLI
        run: |
          make dict
          make clean-objs
          make audio OPT="-O2 -DBM_WITH_DICT=1"
      - name: Build the plugin
        run: |
          make clap-fetch
          make clap
          make clap-test
          make vst3-fetch
          make vst3

      - name: Build the GUI
        run: RAYLIB=/tmp/rl make gui-dict

      # Do not ship a release whose window shows the wrong icon.
      - name: The icon is the one GLFW will use
        run: python tools/check_win_icon.py bencmouth-gui.exe
      - name: Package
        run: |
          V="${GITHUB_REF_NAME:-dev}"
          # The CLI on its own: a console program, no icon, nothing to
          # double-click. Kept separate so it stays small.
          D="bencmouth-$V-windows-x86_64"
          mkdir -p "$D"
          cp bm.exe README.md LICENSE NOTICE "$D"/
          cp -r voices songs "$D"/
          zip -qr "$D.zip" "$D"
          # The GUI, with the font it needs beside it.
          G="bencmouth-gui-$V-windows-x86_64"
          mkdir -p "$G"
          cp bencmouth-gui.exe bm.exe README.md LICENSE NOTICE "$G"/
          cp -r voices songs "$G"/
          zip -qr "$G.zip" "$G"
          # The plugin, on its own: it installs somewhere else entirely and
          # has nothing to do with the two programs above.
          P="bencmouth-clap-$V-windows-x86_64"
          mkdir -p "$P"
          cp build/BENCmouth.clap README.md LICENSE NOTICE "$P"/
          cp -r build/BENCmouth.vst3 "$P"/
          cp -r songs "$P"/
          zip -qr "$P.zip" "$P"
          ls -l ./*.zip
      - uses: actions/upload-artifact@v4
        with: { name: pkg-windows, path: '*.zip', if-no-files-found: error }

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build and verify
        run: |
          make wasm
          node src/wasm/test_wasm.mjs bencmouth.wasm
      - name: Package
        run: |
          V="${GITHUB_REF_NAME:-dev}"
          D="bencmouth-$V-wasm"
          mkdir -p "$D"
          cp bencmouth.wasm src/wasm/bencmouth.js src/wasm/test_wasm.mjs \
             README.md LICENSE NOTICE "$D"/
          tar czf "$D.tar.gz" "$D"
          ls -l "$D.tar.gz"
      - uses: actions/upload-artifact@v4
        with: { name: pkg-wasm, path: '*.tar.gz', if-no-files-found: error }

  publish:
    needs: [linux, macos, windows, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before anything is published. v0.2.0 and v0.2.1 both shipped a GUI
      # whose info panel said 0.1.3, because the constant in the public header
      # and the tag were two independent facts and nothing compared them.
      - name: The tag matches the source
        run: |
          V="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          tools/check_version.sh "$V"

      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -lR dist

      # Asserted before anything is published, because the failure this
      # prevents is silent: every packaging step above ends in a glob, and a
      # glob that matches nothing produces a release that is simply missing a
      # platform. Nobody notices until somebody goes looking for the one they
      # needed.
      - name: Everything that should have been built, was
        run: |
          V="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          fail=0
          for want in \
            "bencmouth-$V-linux-x86_64.tar.gz" \
            "bencmouth-gui-$V-linux-x86_64.tar.gz" \
            "bencmouth-clap-$V-linux-x86_64.tar.gz" \
            "bencmouth-$V-windows-x86_64.zip" \
            "bencmouth-gui-$V-windows-x86_64.zip" \
            "bencmouth-clap-$V-windows-x86_64.zip" \
            "bencmouth-plugins-$V-macos-universal.dmg"; do
            if [ -s "dist/$want" ]; then
              echo "  ok    $want"
            else
              echo "  MISSING  $want"; fail=1
            fi
          done
          # The macOS CLI tarball and disk image carry the architecture in
          # their names, so they are matched by shape rather than by name.
          for glob in "dist/bencmouth-$V-macos-"*.tar.gz \
                      "dist/bencmouth-gui-$V-macos-"*.dmg \
                      "dist/bencmouth-$V-wasm.tar.gz"; do
            if [ -s "$glob" ]; then echo "  ok    $(basename "$glob")"
            else echo "  MISSING  $glob"; fail=1; fi
          done
          exit $fail

      # One thing to download and double-click, which upgrades whatever is
      # already there rather than sitting beside it. Built here rather than in
      # the windows job because the payload is exactly what that job already
      # packaged, and because makensis cross-compiles - the runner it runs on
      # has nothing to do with the installer it produces.
      - name: NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
      - name: Build the Windows installer
        run: |
          V="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          rm -rf stage && mkdir -p stage /tmp/win
          # By glob, not by name: on a workflow_dispatch run the tag and the
          # ref name are different things and the archive is named after
          # whichever one the packaging job saw.
          unzip -qo dist/bencmouth-gui-*-windows-x86_64.zip -d /tmp/win
          cp -r /tmp/win/*/. stage/
          # The plugins are components of the installer.
          unzip -qo dist/bencmouth-clap-*-windows-x86_64.zip -d /tmp/wplug
          cp /tmp/wplug/*/BENCmouth.clap stage/
          cp -r /tmp/wplug/*/BENCmouth.vst3 stage/ 2>/dev/null || true
          ls stage
          # VIProductVersion takes four numbers and nothing else - not "v",
          # not a suffix. v0.2.2 becomes 0.2.2.0, v1 becomes 1.0.0.0.
          N="${V#v}"; N="${N%%-*}"
          case "$N" in
            *.*.*) ;;
            *.*)   N="$N.0" ;;
            *)     N="$N.0.0" ;;
          esac
          # Absolute. makensis resolves a relative source path against the
          # script's own directory rather than the working directory, so
          # "assets/icon/..." would be looked for under tools/ and reported as
          # an icon that could not be opened, three macros deep.
          #
          # -WX because makensis degrades quietly. A bitmap it cannot read is
          # warning 5040 and exit status 0, and what comes out is an installer
          # with the header art silently missing - which is precisely the
          # failure this job exists to prevent.
          # -DHAVE_VST3 only when one was built; the script guards its
          # section on it, so an installer without one is still an installer.
          test -d stage/BENCmouth.vst3 && VST3FLAG=-DHAVE_VST3 || VST3FLAG=
          makensis -WX -V2 $VST3FLAG \
                   -DVERSION="$V" \
                   -DVIVERSION="$N.0" \
                   -DSRCDIR="$PWD/stage" \
                   -DICONFILE="$PWD/assets/icon/bencmouth.ico" \
                   -DARTDIR="$PWD/assets/brand" \
                   -DOUTFILE="$PWD/dist/bencmouth-$V-windows-setup.exe" \
                   tools/windows-installer.nsi
          rm -rf stage
          # A release that quietly ships without its installer is one nobody
          # notices is missing until somebody goes looking for it.
          test -s "dist/bencmouth-$V-windows-setup.exe"
          ls -l dist/*setup.exe

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          gh release create "$V" dist/* \
            --title "BENCmouth $V" \
            --notes-file .github/release-notes.md \
            --verify-tag || \
          gh release upload "$V" dist/* --clobber

name: build

# Each job keeps what it built. An earlier version ran `make clean` as the last
# step of several jobs, so CI proved the build worked and then deleted the
# evidence - the artifacts below are the point of running it on three platforms.

# The README claims BENCmouth builds on Linux, macOS and Windows, but only the
# Linux path was ever built by hand. This is what turns that claim into
# something verified rather than asserted.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # a macOS-only failure should not hide a Linux one
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: ALSA headers
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: make

      - name: Core is freestanding
        run: make check-freestanding

      - name: Tests
        run: make test

      - name: Smoke test the CLI
        run: |
          ./bm "continuous integration" -o ci.wav
          ./bm -t "the quick brown fox"
          ./bm -l
          ls -l ci.wav

      # The shipped songs and voices have to still parse. Both are hand-written
      # text, so a change to the voice keys, the effect keys or the markup
      # commands can invalidate one without touching a line of C - and nothing
      # else in the suite would notice.
      # ...and none of them may hit the limiter. Both novelty songs did on
      # first writing - sustained notes with the declination switched off stack
      # up the way a flutter-free voice does - and a shipped file that clips is
      # not something anyone would think to check by hand twice.
      - name: The shipped songs sing, without clipping
        run: |
          fail=0
          for s in songs/*.bmsong; do
            echo "== $s"
            if ./bm -S "$s" -o /dev/null 2>&1 | tee /dev/stderr | grep -q LIMITED; then
              echo "   ^ hits the limiter"; fail=1
            fi
          done
          exit $fail

      # The pinned voices are exempt from the clipping half of this, and the
      # reason is the contract rather than an oversight: BENCmouth Retro peaks
      # at 1.165 on this sentence and has since long before the check existed,
      # and its gain cannot be lowered without moving a voice that is pinned
      # precisely so it does not move. The soft limiter is what handles it, and
      # handling it is what the limiter is for. Reported, not failed.
      - name: The shipped voices load, without clipping
        run: |
          fail=0
          for v in voices/*.bmvoice; do
            echo "== $v"
            out=$(./bm -f "$v" "The quick brown fox jumps over the lazy dog." \
                    -o /dev/null 2>&1)
            echo "$out"
            case "$out" in
              *LIMITED*)
                case "$v" in
                  *BENCmouth.bmvoice|*"BENCmouth Retro.bmvoice")
                    echo "   ^ known, and pinned - see the comment above" ;;
                  *) echo "   ^ hits the limiter"; fail=1 ;;
                esac ;;
            esac
          done
          exit $fail

      # Enumerated from the binary rather than listed here. The hardcoded list
      # this replaced was written when there were six chains and was still six
      # long after there were thirteen, so the ones added since had never been
      # rendered by CI at all - a check that only covers what it was born
      # knowing about stops being a check.
      - name: Every effects preset renders
        run: |
          ./bm -l
          for e in $(./bm -l | sed -n 's/^  -e \([A-Za-z]*\) .*/\1/p'); do
            echo "== -e $e"
            ./bm -v deep -e "$e" "compliance is mandatory" -o /dev/null
          done

      # Same argument for the voices. Most presets also exist as a .voice file
      # and are covered by the step above, but not all of them do, and a preset
      # that carries an effects chain is only exercised as a pair through -v.
      - name: Every preset voice renders
        run: |
          fail=0
          old="$IFS"; IFS='
          '
          for v in $(./bm -l | sed -n 's/^  \(.*\)  *f0 .*/\1/p' | sed 's/ *$//'); do
            IFS="$old"
            echo "== -v $v"
            out=$(./bm -v "$v" "The quick brown fox jumps over the lazy dog." \
                    -o /dev/null 2>&1)
            echo "$out"
            case "$out" in
              *LIMITED*)
                case "$v" in
                  BENCmouth|"BENCmouth Retro")
                    echo "   ^ known, and pinned - see the comment above" ;;
                  *) echo "   ^ hits the limiter"; fail=1 ;;
                esac ;;
            esac
            IFS='
          '
          done
          IFS="$old"
          exit $fail

      # Built last so it is what survives: the CLI with live audio and the
      # dictionary compiled in, which is the build someone would actually want.
      # A runner has no sound card, so this proves the backend links, not that
      # it plays - only the ALSA path has been heard.
      - name: Build the release binary
        run: |
          make clean
          make dict
          make clean-objs
          make audio OPT="-O2 -DBM_WITH_DICT=1"
          ./bm -h | grep "audio backend"
          ./bm "continuous integration" -o ci.wav
          ls -l bm ci.wav

      - uses: actions/upload-artifact@v4
        with:
          name: bencmouth-${{ matrix.os }}
          path: |
            bm
            ci.wav
          if-no-files-found: error

  windows:
    name: windows-latest (ucrt64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make

      - name: Build
        run: make

      - name: Core is freestanding
        run: make check-freestanding

      - name: Tests
        run: make test

      - name: Smoke test the CLI
        run: |
          ./bm "continuous integration" -o ci.wav
          ./bm -t "the quick brown fox"
          ./bm -l
          ls -l ci.wav

      - name: Build the release binary
        run: |
          make clean
          make dict
          make clean-objs
          make audio OPT="-O2 -DBM_WITH_DICT=1"
          ./bm -h | grep "audio backend"
          ./bm "continuous integration" -o ci.wav
          ls -l bm.exe ci.wav

      - uses: actions/upload-artifact@v4
        with:
          name: bencmouth-windows
          path: |
            bm.exe
            ci.wav
          if-no-files-found: error

  wasm:
    name: wasm32 (freestanding, no libc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build
        run: make wasm

      # Actually runs it. A build that links is not evidence that the module
      # does anything, and this is the only place the wasm path is exercised at
      # all - there is no toolchain for it on the machine it was written on.
      - name: Run the module under Node
        run: node src/wasm/test_wasm.mjs bencmouth.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: bencmouth-wasm
          path: |
            bencmouth.wasm
            src/wasm/bencmouth.js
            src/wasm/test_wasm.mjs
          if-no-files-found: error

  gui:
    name: GUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: X11 and GL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev

      # Built from source rather than taken from apt: the packaged version
      # varies by runner image, and a GUI that only compiles against one of
      # them is not much of a guarantee.
      - name: Build raylib
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j2
          cmake --install /tmp/raylib/build

      # Compile and link only. A runner has no display, so this proves the GUI
      # builds - not that it draws. It was run headless under Xvfb during
      # development, which is where the screenshot in the README came from.
      - name: Build the GUI
        run: RAYLIB=/tmp/rl make gui-dict

      # Tarred rather than uploaded bare, for the second reason in the macOS
      # job below: the artifact zip does not carry the executable bit, so a
      # downloaded binary needs a chmod before it will run. A tar does carry
      # it. The font, icon and licences are already inside the binary.
      - name: Package
        run: tar czf bencmouth-gui-linux.tar.gz bencmouth-gui

      - uses: actions/upload-artifact@v4
        with:
          name: bencmouth-gui-linux
          path: bencmouth-gui-linux.tar.gz
          if-no-files-found: error

      # Last, because it cleans - and by now the artifact is already uploaded.
      - name: The rest of the project still builds without raylib
        run: |
          make clean
          make
          make test

  gui-windows:
    name: GUI (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            git
            mingw-w64-ucrt-x86_64-pkg-config
            make python
      # raylib's own Makefile, not cmake. cmake's "MinGW Makefiles" generator
      # wants mingw32-make, which is a separate package from the MSYS make that
      # is already here - and picking the wrong generator is the kind of thing
      # that fails at configure time for reasons unrelated to this project.
      # raylib ships a plain Makefile that needs neither.
      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          make -C /tmp/raylib/src PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC -j2
          mkdir -p /tmp/rl/include /tmp/rl/lib
          cp /tmp/raylib/src/raylib.h /tmp/raylib/src/raymath.h /tmp/raylib/src/rlgl.h /tmp/rl/include/
          cp /tmp/raylib/src/libraylib.a /tmp/rl/lib/
          ls -l /tmp/rl/lib /tmp/rl/include

      # raylib is built from source above, so RAYLIB= is set and pkg-config is
      # not consulted at all. Printed anyway: this is the output to read first
      # when a Windows link fails, and it should not take a code change to get.
      - name: What the build decided
        run: RAYLIB=/tmp/rl make gui-info

      - name: Build the GUI
        run: RAYLIB=/tmp/rl make gui-dict

      # A missing resource is not a link error - windres simply not running
      # leaves an iconless binary that builds and works - so this checks for the
      # thing itself.
      #
      # It used to assert a minimum file size, which was a guess calibrated
      # against a statically linked Linux build and failed on a perfectly good
      # Windows one. Look for the .rsrc section instead: it exists only if
      # resources were linked, and it does not care how big anything is.
      # And it is the icon GLFW will actually use. Presence is not enough:
      # GLFW loads the window-class icon by the name GLFW_ICON and silently
      # falls back to the generic Windows one otherwise, so a numerically
      # numbered icon passes every "is there a resource" test while leaving the
      # titlebar and taskbar wrong. This walks the resource directory of the
      # built binary, which is the only place the answer actually lives -
      # grepping the .rc cannot tell you whether windres ran.
      - name: The icon is really in there
        run: |
          ls -l bencmouth-gui.exe
          python tools/check_win_icon.py bencmouth-gui.exe

      # Static, so a downloaded binary does not need MSYS2's DLLs on PATH.
      - name: No MSYS2 DLL dependencies
        run: |
          if objdump -p bencmouth-gui.exe | grep -iE 'DLL Name:.*(raylib|libgcc|libwinpthread|msys)'; then
            echo "links a DLL that will not be present on a user's machine"
            exit 1
          fi
          echo "self-contained"

      - uses: actions/upload-artifact@v4
        with:
          name: bencmouth-gui-windows
          # Just the executable: the font, icon and licences are inside it.
          path: bencmouth-gui.exe
          if-no-files-found: error

  # Built here as well as at release time, for the same reason the disk image
  # is: a broken installer should show up on a push rather than on a tag.
  #
  # On Linux, because that is where the release job builds it too - makensis
  # cross-compiles, and the runner it runs on has nothing to do with the
  # installer it produces. Running it here on Windows instead would test a
  # different invocation than the one that ships, with native paths where the
  # release job passes POSIX ones.
  #
  # The payload is the real thing, taken from the two Windows jobs above, so
  # what comes out is an installer somebody can actually run on a Windows
  # machine and try - not a syntax check with placeholder files in it.
  installer:
    name: Windows installer
    runs-on: ubuntu-latest
    needs: [windows, gui-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bencmouth-windows, path: dl/cli }
      - uses: actions/download-artifact@v4
        with: { name: bencmouth-gui-windows, path: dl/gui }
      - name: NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
      - name: Assemble what goes in it
        run: |
          mkdir -p stage
          cp dl/gui/bencmouth-gui.exe dl/cli/bm.exe stage/
          cp README.md LICENSE NOTICE stage/
          cp -r voices songs stage/
          ls -l stage

      # Named for the commit, like the disk image, because this one gets
      # uploaded and somebody has to be able to tell which build they ran.
      #
      # -WX because makensis degrades quietly: a bitmap it cannot read is a
      # warning and exit status 0, and what comes out is an installer with the
      # art silently missing.
      - name: It builds
        run: |
          V="$(git rev-parse --short HEAD)"
          echo "SETUP=bencmouth-$V-windows-setup.exe" >> "$GITHUB_ENV"
          makensis -WX -V2 \
                   -DVERSION="$V" \
                   -DVIVERSION="0.0.0.0" \
                   -DSRCDIR="$PWD/stage" \
                   -DICONFILE="$PWD/assets/icon/bencmouth.ico" \
                   -DARTDIR="$PWD/assets/brand" \
                   -DOUTFILE="$PWD/bencmouth-$V-windows-setup.exe" \
                   tools/windows-installer.nsi
          ls -l "bencmouth-$V-windows-setup.exe"

      # A .exe that is not a .exe is worth ruling out before anyone downloads
      # it, and the version resource is the one thing in there that comes from
      # a command line rather than from the script.
      - name: It is a Windows executable, and it knows what it is
        run: |
          file "$SETUP" | grep -q "PE32.*executable"
          python3 - "$SETUP" <<'PY'
          import sys
          exe = open(sys.argv[1], 'rb').read()
          for s in ('BENCmouth', 'BENCO Holdings', '0.0.0.0'):
              assert s.encode('utf-16-le') in exe, f'missing from version info: {s}'
              print('  ok ', s)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bencmouth-windows-installer
          path: bencmouth-*-windows-setup.exe
          if-no-files-found: error

  # Building the installer is not the same as running it, and the difference
  # matters most for the one thing in it that edits a setting outside its own
  # folder. makensis cannot check a System::Call - the plugin parses those at
  # run time - so the PATH code compiles clean whether or not it works, and the
  # only way to know is to install on a real Windows and read the registry.
  #
  # The strong assertion is the last one: after the uninstaller has run, PATH
  # has to be byte-for-byte what it was before the install. Anything less would
  # pass while leaving a stray semicolon or eating a neighbouring entry.
  installer-run:
    name: Windows installer, installed
    runs-on: windows-latest
    needs: [installer]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: bencmouth-windows-installer, path: dl }

      - name: The default install leaves PATH alone
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dl\*.exe)[0].FullName
          $before = [Environment]::GetEnvironmentVariable('Path', 'User')
          Start-Process -FilePath $exe -ArgumentList '/S' -Wait
          $after = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($after -ne $before) {
            throw "a plain /S install changed PATH`n  before: $before`n  after:  $after"
          }
          Write-Host "  ok  PATH untouched by the default install"

          $bm = 'C:\Program Files\BENCmouth\bm.exe'
          if (-not (Test-Path $bm)) { throw "bm.exe was not installed" }
          & $bm --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bm.exe --help exited $LASTEXITCODE" }
          Write-Host "  ok  bm.exe installed and runs"

          # _?= keeps the uninstaller from copying itself to temp and returning
          # before it has finished, which is what makes -Wait meaningless.
          Start-Process -FilePath 'C:\Program Files\BENCmouth\uninstall.exe' `
                        -ArgumentList '/S', '_?=C:\Program Files\BENCmouth' -Wait
          Remove-Item -Recurse -Force 'C:\Program Files\BENCmouth' `
                      -ErrorAction SilentlyContinue

      - name: /PATH adds exactly one entry, and the uninstaller takes it back
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dl\*.exe)[0].FullName
          $before = [Environment]::GetEnvironmentVariable('Path', 'User')
          Write-Host "  before: $before"

          Start-Process -FilePath $exe -ArgumentList '/S', '/PATH' -Wait
          $after = [Environment]::GetEnvironmentVariable('Path', 'User')
          Write-Host "  after:  $after"

          if ($after -notmatch [regex]::Escape('BENCmouth')) {
            throw "/PATH did not add anything to PATH"
          }
          $added = @($after -split ';' | Where-Object { $_ -match 'BENCmouth' })
          if ($added.Count -ne 1) {
            throw "expected one BENCmouth entry, found $($added.Count): $($added -join ' | ')"
          }
          if ($added[0] -ne 'C:\Program Files\BENCmouth') {
            throw "the entry is not the install directory: $($added[0])"
          }
          Write-Host "  ok  one entry, and it is the install directory"

          # Installing over the top *without* /PATH stands in for an upgrade,
          # and tests two things at once. The entry must survive - the upgrade
          # runs the old uninstaller first, which removes it, and the tickbox is
          # off by default, so it comes back only because the previous install
          # recorded OnPath. And it must not come back twice.
          Start-Process -FilePath $exe -ArgumentList '/S' -Wait
          $twice = [Environment]::GetEnvironmentVariable('Path', 'User')
          $again = @($twice -split ';' | Where-Object { $_ -match 'BENCmouth' })
          if ($again.Count -ne 1) {
            throw "after an upgrade there are $($again.Count) entries, not 1: $twice"
          }
          Write-Host "  ok  an upgrade keeps the entry, and keeps exactly one"

          Start-Process -FilePath 'C:\Program Files\BENCmouth\uninstall.exe' `
                        -ArgumentList '/S', '_?=C:\Program Files\BENCmouth' -Wait
          $end = [Environment]::GetEnvironmentVariable('Path', 'User')
          Write-Host "  end:    $end"
          if ($end -ne $before) {
            throw "PATH was not restored exactly`n  before: $before`n  end:    $end"
          }
          Write-Host "  ok  PATH is byte-for-byte what it was"

  gui-macos:
    name: GUI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # From source and static, not `brew install raylib`. Homebrew's raylib is
      # a dylib under /opt/homebrew, and a binary linked against it aborts at
      # launch on any machine without that exact library - which is every
      # machine that has just downloaded a release.
      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build
          ls -l /tmp/rl/lib
      - name: What the build decided
        run: RAYLIB=/tmp/rl make gui-info
      - name: Build the GUI
        run: RAYLIB=/tmp/rl make gui-dict

      # The check that would have caught shipping a Homebrew-linked binary.
      # Anything outside /usr/lib and /System is not on a stock Mac.
      - name: No non-system dynamic libraries
        run: |
          otool -L bencmouth-gui
          if otool -L bencmouth-gui | tail -n +2 | \
             grep -vE '^[[:space:]]+(/usr/lib/|/System/)'; then
            echo "links a library that will not be present on a stock macOS"
            exit 1
          fi
          echo "self-contained"
      # Built here as well as at release time, so a broken bundle shows up on a
      # push rather than on a tag.
      # Split into its own steps so a failure names itself: without a log the
      # step name is the only signal, and "the bundle and the image and the
      # checks" as one step says nothing about which of them broke.
      - name: The .app bundle builds
        run: |
          BM_VERSION=0.0.0 ./tools/macos-app.sh bencmouth-gui BENCmouth.app
          test -f BENCmouth.app/Contents/Resources/BENCmouth.icns
          test -f BENCmouth.app/Contents/MacOS/BENCmouth
          test -d BENCmouth.app/Contents/Resources/voices
          test -d BENCmouth.app/Contents/Resources/songs
          plutil -lint BENCmouth.app/Contents/Info.plist
          # Finder decides an app is an app from these two facts alone.
          test "$(plutil -extract CFBundleExecutable raw \
                    BENCmouth.app/Contents/Info.plist)" = BENCmouth
          test "$(plutil -extract CFBundlePackageType raw \
                    BENCmouth.app/Contents/Info.plist)" = APPL

      # The check that would have caught shipping a bundle macOS calls
      # "damaged": a signature that does not validate against the bundle it is
      # in. Ad-hoc identifies nobody, but it has to verify.
      - name: The bundle's signature validates
        run: |
          codesign --verify --deep --strict --verbose=2 BENCmouth.app
          codesign -dvv BENCmouth.app 2>&1 | head -20
          # Informational: unnotarized software is rejected here by design, and
          # that rejection is the "unidentified developer" prompt, not "damaged".
          spctl -a -t exec -vv BENCmouth.app || true

      # In a venv rather than `pip install --user`: a runner's system Python is
      # externally managed and refuses the latter outright.
      - name: dmgbuild
        run: |
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install --quiet dmgbuild
          /tmp/dmgvenv/bin/dmgbuild --help >/dev/null

      # Named for the commit, not "test", because this one gets uploaded and
      # somebody has to be able to tell which build they double-clicked. The
      # volume name stays plain "BENCmouth": it becomes the mounted disk's
      # name, and that is what belongs on a desktop.
      - name: The disk image builds
        run: |
          DMG="bencmouth-gui-$(git rev-parse --short HEAD)-macos-$(uname -m).dmg"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          DMGBUILD=/tmp/dmgvenv/bin/dmgbuild ./tools/macos-dmg.sh \
            BENCmouth.app "$DMG" BENCmouth

      # hdiutil will not create the mount point for you.
      - name: Mount the disk image
        run: |
          mkdir -p /tmp/dmg
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/dmg
          ls -la /tmp/dmg

      - name: It is draggable
        run: |
          test -d /tmp/dmg/BENCmouth.app
          test -L /tmp/dmg/Applications

      # The layout lives in this file. Without it the image opens as a plain
      # list and the background nobody sees might as well not be there.
      - name: It carries the window layout
        run: test -f /tmp/dmg/.DS_Store

      # Reported, not asserted. Where dmgbuild puts the volume icon and the
      # background is dmgbuild's business, and a build that fails because a
      # tool renamed an internal file is a build that fails for no reason.
      - name: What else it carries
        run: |
          ls -la /tmp/dmg/.background/ 2>/dev/null || echo "no .background/"
          test -f /tmp/dmg/.VolumeIcon.icns \
            && echo "volume icon present" || echo "no .VolumeIcon.icns"

      - name: Unmount
        if: always()
        run: hdiutil detach /tmp/dmg || true

      # The disk image, not the .app.
      #
      # This job built and verified an image and then uploaded the bare bundle
      # instead, which defeats every reason the image exists. upload-artifact
      # zips whatever path it is given, and three things do not survive that
      # round trip:
      #
      #   - the wrapper. A .app is a directory, so it arrives on the other end
      #     as a folder called Contents - which is exactly what happened to the
      #     first person who was handed a tarball of one.
      #   - the executable bit, which the zip format as GitHub writes it does
      #     not carry, so Contents/MacOS/BENCmouth would not run even once
      #     found.
      #   - the code signature, which seals file modes. Losing them invalidates
      #     it, and an invalid signature is precisely the state macOS reports
      #     as "damaged" - the failure the signing step above exists to
      #     prevent.
      #
      # A disk image survives all three, because it is one file with a
      # filesystem inside it. The zip carries the image; the image carries the
      # permissions.
      - uses: actions/upload-artifact@v4
        with:
          name: bencmouth-gui-macos
          path: ${{ env.DMG }}
          if-no-files-found: error

  strict:
    name: ubuntu strict warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The makefile already builds with -Wall -Wextra -Wpedantic -Wconversion
      # and friends. This makes any of them fatal, so a warning cannot quietly
      # accumulate.
      - name: Build with -Werror
        run: make OPT="-O2 -Werror"

      # Markup is optional in core, so the build without it has to stay clean
      # too - an unused-parameter warning there would only surface on an
      # embedded build, which is the last place anyone wants to find it.
      - name: Build with markup compiled out
        run: |
          make clean
          make lib OPT="-O2 -Werror -DBM_WITH_MARKUP=0"
          make clean

      # The dictionary is optional, so its build has to stay clean too - and it
      # is the only configuration that exercises bm_dict.c's search at all.
      - name: Build and test with CMUdict
        run: |
          make clean
          make dict
          make test OPT="-O2 -DBM_WITH_DICT=1"
          make clean

      # The fixed-point sample loop is a second implementation of the DSP, so
      # it needs its own pass through the suite - a float-only run would not
      # touch a line of it.
      - name: Build and test in fixed point
        run: |
          make clean
          # `default`, not `all`: this job wants the library and the CLI built
          # in fixed point, not the GUI and the wasm module dragged along with
          # a flag that has nothing to say to either.
          make default OPT="-O2 -Werror -DBM_FIXED_POINT=1"
          make test OPT="-O2 -DBM_FIXED_POINT=1"
          make clean

      - name: Build at -O0 with sanitizers
        run: |
          make clean
          make OPT="-O0 -g -fsanitize=address,undefined" LDFLAGS="-fsanitize=address,undefined"
          make test OPT="-O0 -g -fsanitize=address,undefined" LDFLAGS="-fsanitize=address,undefined"
